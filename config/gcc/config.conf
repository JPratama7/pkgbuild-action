export CC="/usr/bin/gcc"
export CXX="/usr/bin/g++"
export CC_LD="/usr/bin/ld.mold"
export CXX_LD="/usr/bin/ld.mold"
export LD="/usr/bin/ld.mold"
export AR="/usr/bin/ar"
export NM="/usr/bin/nm"
export STRIP="/usr/bin/strip"
export OBJCOPY="/usr/bin/objcopy"
export OBJDUMP="/usr/bin/objdump"
export READELF="/usr/bin/readelf"
export RANLIB="/usr/bin/ranlib"
export HOSTCC="/usr/bin/gcc"
export HOSTCXX="/usr/bin/g++"
export HOSTAR="/usr/bin/ar"
export HOSTLD="/usr/bin/ld.mold"
export PROFILE=release

#-- Compiler and Linker Flags
#-- Loop Optimizations
_loop="-ftree-loop-linear \
    -floop-strip-mine \
    -floop-block \
    -ftree-loop-vectorize \
    -ftree-loop-ivcanon -funswitch-loops \
    -fmove-loop-stores \
    -fpeel-loops \
    -ftree-loop-if-convert \
    -freschedule-modulo-scheduled-loops \
    -floop-unroll-and-jam -ftree-loop-im \
    -floop-interchange \
    -floop-nest-optimize \
    -ftree-loop-distribution"

#-- Vectorization
_vectorize="-ftree-vectorize -ftree-loop-vectorize -fvect-cost-model=dynamic"

#-- Tree and Expression Optimizations
_tree="-ftree-ter -ftree-lrs -ftree-partial-pre -fpredictive-commoning -fivopts -flive-range-shrinkage"

#-- Instruction Scheduling
_sched="-fselective-scheduling \
    -fpeephole2 \
    -fsched-spec \
    -fsel-sched-pipelining \
    -fsel-sched-pipelining-outer-loops \
    -fschedule-insns \
    -fsched-rank-heuristic \
    -fsched-pressure"

#-- Register and Pressure Optimization
_register="-fira-hoist-pressure -fira-loop-pressure"

#-- Interprocedural Analysis (IPA)
_ipa="-fipa-icf -fipa-icf-functions -fipa-icf-variables -fipa-modref -fipa-strict-aliasing"

#-- Inlining and Function Optimizations
_function="-freorder-functions -flimit-function-alignment -fsplit-paths"

#-- Devirtualization (C++ specific)
_virtual="-fdevirtualize -fdevirtualize-at-ltrans -fdevirtualize-speculatively -fallocation-dce"

#-- Global Common Subexpression Elimination
_gcse="-fgcse-lm -fgcse-sm -fgcse-after-reload"

#-- Graphite Framework
_graphite="-fgraphite -fgraphite-identity"

#-- Memory and Data Layout
_layout="-fdata-sections -ffunction-sections -mfpmath=sse"

_cxx_flags="-flifetime-dse"

#-- Security Hardening
_security="-Wformat -Werror=format-security -fstack-clash-protection -fcf-protection -Wp,-D_GLIBCXX_ASSERTIONS"

#-- General Optimizations
_general="-fstdarg-opt -fuse-linker-plugin -fno-plt -fomit-frame-pointer -fvar-tracking-assignments -fmalloc-dce"

_cc="-O2 -pipe \
    $_security \
    $_general \
    $_layout \
    $_ipa \
    $_register \
    $_function \
    $_loop \
    $_vectorize \
    $_tree \
    $_sched \
    $_gcse \
    $_graphite"

_cxx="$_cc \
    -Wp,-D_GLIBCXX_ASSERTIONS \
    $_cxx_flags \
    $_virtual"

_linker="-fuse-ld=mold \
    -Wl,-O1 \
    -Wl,--gc-sections \
    -Wl,--as-needed \
    -Wl,-z,relro \
    -Wl,-z,now \
    -Wl,--icf=safe \
    -Wl,--color-diagnostics \
    -Wl,--fatal-warnings \
    -Wl,--pack-dyn-relocs=relr \
    -Wl,-z,pack-relative-relocs \
    -Wl,--threads=50"

_lto="-ffat-lto-objects \
    -flto=auto"