_default="-Qunused-arguments \
    -ffunction-sections \
    -fdata-sections \
    -fno-plt \
    -fcolor-diagnostics \
    -pipe \
    -fstack-protector \
    -fstack-clash-protection \
    -Wformat \
    -Werror=format-security"

_compiler="$_default -O3 $_llvm $_polly $_verify -fuse-ld=lld -fno-global-isel"