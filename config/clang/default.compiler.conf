_default="-Qunused-arguments \
    -ffunction-sections \
    -fdata-sections \
    -fno-plt \
    -fcolor-diagnostics \
    -pipe \
    -fstack-protector \
    -fstack-clash-protection \
    -Wformat \
    -Werror=format-security"

_plugin="$_custom_plugin"
_compiler="$_default -O3 $_plugin $_llvm $_polly $_verify -fuse-ld=lld"