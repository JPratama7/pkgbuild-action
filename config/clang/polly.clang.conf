_polly="-fpass-plugin=/usr/lib/LLVMPolly.so \
  -mllvm --polly \
  -mllvm --polly-on-isl-error-abort \
  -mllvm --polly-detect-profitability-min-per-loop-insts=40 \
  -mllvm --polly-detect-full-functions \
  -mllvm --polly-detect-track-failures \
  -mllvm --polly-enable-prune-unprofitable \
\
  -mllvm --polly-2nd-level-tiling \
  -mllvm --polly-tiling \
  -mllvm --polly-register-tiling \
\
  -mllvm --polly-enable-optree \
  -mllvm --polly-optree-analyze-known \
  -mllvm --polly-optree-normalize-phi \
\
  -mllvm --polly-run-dce \
  -mllvm --polly-delinearize \
  -mllvm --polly-reschedule \
  -mllvm --polly-postopts \
  -mllvm --polly-pattern-matching-based-opts \
\
  -mllvm --polly-ast-use-context \
  -mllvm --polly-dependences-use-reductions \
  -mllvm --polly-detect-reductions \
\
  -mllvm --polly-enable-delicm \
  -mllvm --polly-delicm-compute-known \
  -mllvm --polly-delicm-overapproximate-writes \
\
  -mllvm --polly-tc-opt \
  -mllvm --polly-annotate-metadata-vectorize \
  -mllvm --polly-invariant-load-hoisting \
  -mllvm --polly-vectorizer=stripmine"


_polly_lld=" -Wl,--load-pass-plugin=/usr/lib/LLVMPolly.so -Wl,-mllvm=-load=/usr/lib/LLVMPolly.so -Wl,-mllvm=-polly"

_rpoly="-C link-arg=-Wl,--load-pass-plugin=/usr/lib/LLVMPolly.so -C link-arg=-Wl,-mllvm=-load=/usr/lib/LLVMPolly.so \
  -C link-arg=-Wl,-mllvm=-polly \
  -C link-arg=-Wl,-mllvm=-polly-pattern-matching-based-opts \
  -C link-arg=-Wl,-mllvm=-polly-detect-full-functions \
  -C link-arg=-Wl,-mllvm=-polly-ast-use-context \
  -C link-arg=-Wl,-mllvm=-polly-dependences-use-reductions \
  -C link-arg=-Wl,-mllvm=-polly-detect-reductions \
  -C link-arg=-Wl,-mllvm=-polly-enable-simplify \
  -C link-arg=-Wl,-mllvm=-polly-vectorizer=stripmine \
  -C link-arg=-Wl,-mllvm=-polly-run-dce \
  -C link-arg=-Wl,-mllvm=-polly-tiling \
  -C link-arg=-Wl,-mllvm=-polly-2nd-level-tiling \
  -C link-arg=-Wl,-mllvm=-polly-register-tiling \
  -C link-arg=-Wl,-mllvm=-polly-reschedule \
  -C link-arg=-Wl,-mllvm=-polly-postopts \
  -C link-arg=-Wl,-mllvm=-polly-enable-prune-unprofitable"
