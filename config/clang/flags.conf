_cc="$_compiler"
_cxx="$_compiler -Wp,-D_GLIBCXX_ASSERTIONS"
_linker="-fuse-ld=lld \
    -Wl,-O1 \
    -Wl,--sort-common \
    -Wl,--as-needed \
    -Wl,--gc-sections \
    -Wl,--icf=safe \
    -Wl,--hash-style=gnu \
    -Wl,--color-diagnostics \
    -Wl,--threads=50 \
    -Wl,-z,relro \
    -Wl,-z,now \
    -Wl,-z,noexecstack \
    -Wl,-z,separate-code \
    -Wl,--pack-dyn-relocs=relr \
    $_llvm_lld \
    $_polly_lld"

_rust="-C opt-level=3 \
    -C embed-bitcode=yes \
    -C lto=thin \
    -Clinker-plugin-lto \
    -C codegen-units=1 \
    -C linker=clang \
    -Clink-arg=-fuse-ld=lld \
    $_custom_rustc \
    $_ldrust \
    $_rllvm \
    $_rpoly"

_lto="-flto=thin \
    -funified-lto \
    -ffat-lto-objects \
    -Wl,--fat-lto-objects \
    -Wl,--lto-O3"
