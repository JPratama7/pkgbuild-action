name: Makepkg Build and Check
author: JPratama7
description: Build and check a PKGBUILD package
branding:
  color: blue
  icon: chevron-up
inputs:
  pkgdir:
    description: "Relative path to directory containing the PKGBUILD file."
    required: false
    default: "."
  customPackages:
    description: "Additional packages to install via pacman."
    required: false
    default: ""
  extraFlags:
    description: "Additional flags to pass to the compiler."
    required: false
    default: ""
  plugins:
    description: "Append to PLUGINS"
    required: false
    default: ""
  cflags:
    description: "Append to CFLAGS"
    required: false
    default: ""
  cxxflags:
    description: "Append to CXXFLAGS"
    required: false
    default: ""
  ldflags:
    description: "Append to LDFLAGS"
    required: false
    default: ""
  rustcflags:
    description: "Append to RUSTFLAGS"
    required: false
    default: ""
  clanged: 
    description: "Use LLVM Toolchain to Compile"
    required: false
    default: "N"
  officialRepo:
    description: "Use Arch Repository LLVM Toolchain to Compile"
    required: false
    default: "N"
  bootstrap:
    description: "Use LLVM Bootstrap for build"
    required: false
    default: "N"
  clangedPFlags:
    description: "Use LLVM Toolchain Specific Flags to Compile"
    required: false
    default: "N"
  maxJobs:
    description: "Max Jobs"
    required: false
    default: "99"
  clangedPolly:
    description: "Use Polly - Polyhedral optimizations (Private Repo Only)"
    required: false
    default: "N"
  gccPFlags:
    description: "GCC Performance focused flags"
    required: false
    default: "N"
  namcapDisable:
    description: "Disable namcap checks if nonempty."
    required: false
    default: ""
  namcapRules:
    description: "A comma-separated list of rules for namcap to run."
    required: false
    default: ""
  namcapExcludeRules:
    description: "A comma-separated list of rules for namcap not to run."
    required: false
    default: ""
  makepkgArgs:
    description: "Additional arguments to pass to makepkg."
    required: false
    default: ""
  gpg:
    description: "Add GPG key"
    required: false
    default: ""
  chaoticAur:
    description: "Enable Chaotic AUR"
    required: false
    default: ""
  aurHelper:
    description: "AUR Helper Package"
    required: false
    default: ""
  buildAurHelper:
    description: "Build Aur Helper"
    required: false
    default: ""
  aurArgs:
    description: "AUR Helper args"
    required: false
    default: ""
outputs:
  pkgfile0:
    description: "Filename of the first generated package archive. Usually only one."
  pkgfile1:
    description: "Filename of the 2nd generated package archive, etc."

runs:
  using: 'docker'
  image: 'Dockerfile'
